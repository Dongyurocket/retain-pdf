name: retainpdf

services:
  app:
    # 本仓库不发布官方镜像，默认从源码本地构建；也可用 APP_IMAGE 指向自建镜像。
    image: ${APP_IMAGE:-retainpdf-app:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    env_file:
      - ./docker/app.env
    ports:
      - "${APP_PORT:-41000}:41000"
      - "${APP_SIMPLE_PORT:-42000}:42000"
    volumes:
      - app_data:/data
      - ./docker/auth.local.json:/app/backend/rust_api/auth.local.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-retainpdf-web:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
      args:
        RETAIN_PDF_VERSION: ${RETAIN_PDF_VERSION:-local}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./docker/web.env
    ports:
      - "${WEB_PORT:-40001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  app_data:
